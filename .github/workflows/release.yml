# A commit to main that changes VERSION publishes release v<VERSION> (docs/DECISIONS.md N40):
# CI on that commit, then binaries for four targets, then the tag and the GitHub release.
# A version with a suffix (0.2.0-rc.1) is a prerelease. Releasing a version twice fails.
# The release notes are the version's section of CHANGELOG.md (`## v<VERSION> — <date>`); a
# version without one is refused before CI runs.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Read VERSION
        id: version
        run: |
          version=$(tr -d ' \n' < VERSION)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::VERSION is not a version: '$version'"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Refuse a version without release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          .github/scripts/release_notes.sh "$TAG" > notes.md
          cat notes.md

      - name: Refuse a version already released
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG already exists: bump VERSION to release again"
            exit 1
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install the pinned Zig
        run: ./zig/download.sh

      # Every target is cross-compiled from Linux. The binary reports `<protocol>+<commit>`: the
      # protocol is the data file and protocol release (`release` in build.zig), changed
      # deliberately (N32, N43); VERSION names the release.
      - name: Build
        run: |
          mkdir dist
          for target in x86_64-linux aarch64-linux x86_64-macos aarch64-macos; do
            ./zig/zig build -Drelease -Dtarget="$target"
            name="nerva-$TAG-$target"
            mkdir "$name"
            cp zig-out/bin/nerva LICENSE NOTICE "$name/"
            tar -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)

      - name: Check the Linux x86_64 binary runs
        run: |
          tar -xzf "dist/nerva-$TAG-x86_64-linux.tar.gz"
          "./nerva-$TAG-x86_64-linux/nerva" version | tee version.txt
          grep -q "+$(git rev-parse --short=7 HEAD)" version.txt
          echo "BINARY_VERSION=$(sed 's/^Nerva version //' version.txt)" >> "$GITHUB_ENV"

      # Creates the tag on exactly this commit, then the release.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          {
            .github/scripts/release_notes.sh "$TAG"
            echo
            echo "---"
            echo
            echo "Nerva at commit $GITHUB_SHA. Binaries report \`$BINARY_VERSION\`." \
              "Check downloads against \`SHA256SUMS\`."
          } > notes.md
          gh release create "$TAG" dist/* "${prerelease[@]}" --target "$GITHUB_SHA" \
            --title "Nerva $TAG" --notes-file notes.md
