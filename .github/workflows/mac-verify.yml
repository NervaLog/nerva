# Checks the macOS zip the owner uploaded to a release (v0.7.1, docs/briefs/v0.7.1.md, step 7).
#
# The Mac zip is signed with a Developer ID, hardened and notarized on the owner's Mac
# (`zig build mac-release -Dnotarize=true`) and uploaded, with its `.zip.sha256`, to release.yml's
# draft; the owner then publishes it. No Apple secret is in CI, so this workflow is where the signature
# is checked, on both architectures, on a runner that never saw the Mac:
#   1. the zip matches its `.zip.sha256`;
#   2. `codesign -dv` shows a Developer ID Application authority and the hardened runtime;
#   3. tests/macos/smoke.py (slice 2: three replicas, the gateway, statsd, SIGTERM) passes on that
#      binary, with `--expect-signature developer-id`;
#   4. `brew install nervalog/tap/nerva && brew test nerva`.
# It runs when a release is published, and by hand with a tag (also against a draft: the assets are
# found through the releases list, which a draft appears in for a token with write access). The owner
# commits Formula/nerva.rb to the tap after publishing, so on the `release` event step 4 waits for
# the tap to name this version (up to 20 minutes); a dispatch does not wait.
name: Mac verify

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag, v<VERSION>, published or a draft'
        required: true
        type: string
  release:
    types: [published]

# Listing a draft release needs write access; nothing is written.
permissions:
  contents: write

concurrency:
  group: mac-verify-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The default branch's smoke test and nothing else: a draft has no tag to check out.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Refuse a tag that is not a version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (v<VERSION>)"
            exit 1
          fi

      - name: Download the zip and its checksum
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          zip="nerva-$TAG-universal-macos.zip"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\")" > release.json
          test -s release.json || { echo "::error::no release or draft named $TAG"; exit 1; }
          for name in "$zip" "$zip.sha256"; do
            id=$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .id' release.json | head -n1)
            test -n "$id" || { echo "::error::$TAG has no asset $name"; exit 1; }
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$name"
          done
          ls -l

      - name: The zip matches its checksum
        run: |
          cd "$RUNNER_TEMP/dl"
          shasum -a 256 -c "nerva-$TAG-universal-macos.zip.sha256"
          unzip -q "nerva-$TAG-universal-macos.zip"
          chmod +x "nerva-$TAG-universal-macos/nerva"
          lipo -archs "nerva-$TAG-universal-macos/nerva"

      # Developer ID Application, and the hardened runtime (`flags=0x10000(runtime)`; an ad hoc
      # signature adds `adhoc` to the flags and has no such authority, so an ad hoc zip fails here).
      - name: Developer ID and the hardened runtime
        run: |
          nerva="$RUNNER_TEMP/dl/nerva-$TAG-universal-macos/nerva"
          codesign -dv --verbose=4 "$nerva" 2> signature.txt
          cat signature.txt
          grep -q '^Authority=Developer ID Application' signature.txt \
            || { echo "::error::$TAG's nerva is not signed with a Developer ID Application certificate"; exit 1; }
          grep -Eq 'flags=0x[0-9a-f]+\([^)]*runtime' signature.txt \
            || { echo "::error::$TAG's nerva does not have the hardened runtime"; exit 1; }
          codesign --verify --strict --verbose=2 "$nerva"

      - name: Smoke test (tests/macos/smoke.py)
        run: |
          python3 tests/macos/smoke.py "$RUNNER_TEMP/dl/nerva-$TAG-universal-macos/nerva" \
            --arch "${{ matrix.arch }}" --expect-signature developer-id

      - name: brew install nervalog/tap/nerva, brew test
        env:
          EVENT: ${{ github.event_name }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -eu
          version="${TAG#v}"
          attempts=1
          if [ "$EVENT" = release ]; then attempts=10; fi
          brew tap nervalog/tap
          for attempt in $(seq 1 "$attempts"); do
            git -C "$(brew --repository nervalog/tap)" pull --quiet
            stable=$(brew info --json=v2 nervalog/tap/nerva | jq -r '.formulae[0].versions.stable')
            if [ "$stable" = "$version" ]; then break; fi
            echo "the tap has nerva $stable, not $version (attempt $attempt of $attempts)"
            if [ "$attempt" = "$attempts" ]; then
              echo "::error::nervalog/tap's nerva is $stable, not $version: commit Formula/nerva.rb"
              exit 1
            fi
            sleep 120
          done
          brew install nervalog/tap/nerva
          nerva version | tee version.txt
          grep -qx "version $version" version.txt
          brew test nerva
