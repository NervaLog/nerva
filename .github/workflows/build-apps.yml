name: Build Changed Apps

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - 'modules/**'
      - 'libraries/**'
      - 'external/**'
      - 'integrations/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/**'

concurrency:
  group: build-changed-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_apps: ${{ steps.set-matrix.outputs.has_apps }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        with:
          filters: |
            main: 'apps/main/**'
            _shared:
              - 'modules/**'
              - 'libraries/**'
              - 'external/**'
              - 'integrations/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/**'

      - name: Generate Matrix
        id: set-matrix
        env:
          SHARED_CHANGED: ${{ steps.filter.outputs._shared }}
          CHANGES_JSON: ${{ steps.filter.outputs.changes }}
        shell: bash
        run: |
          set -euo pipefail

          # Get all buildable apps (exclude directories starting with _)
          ALL_APPS_JSON="$(find apps -maxdepth 1 -mindepth 1 -type d ! -name '_*' -printf '%f\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')"

          if [[ "$SHARED_CHANGED" == "true" ]]; then
            # Shared code changed - build all apps
            APPS_JSON="$ALL_APPS_JSON"
          else
            # Only build changed apps
            APPS_JSON="$CHANGES_JSON"
            # Remove _shared from the list
            APPS_JSON="$(printf '%s' "$APPS_JSON" | jq -c 'map(select(. != "_shared"))')"
          fi

          # Check if we have any apps to build
          APP_COUNT="$(printf '%s' "$APPS_JSON" | jq 'length')"
          if [[ "$APP_COUNT" -eq 0 ]]; then
            echo "has_apps=false" >> "$GITHUB_OUTPUT"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            echo "has_apps=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$APPS_JSON" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build with Jib
        env:
          # GITHUB_TOKEN for pushing to GHCR (same org)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # DAILYWOMBAT_TOKEN for pulling DailyWombat packages (cross-org)
          DAILYWOMBAT_TOKEN: ${{ secrets.DAILYWOMBAT_TOKEN }}
          GITHUB_RELEASE_TAG: ${{ github.sha }}
          APP_NAME: ${{ matrix.app }}
        run: ./gradlew --no-daemon --stacktrace ":apps:${APP_NAME}:jib"
