name: Lint GitHub Actions

on:
  pull_request:
    paths:
      - '.github/**'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          curl -sL "$(curl -s https://api.github.com/repos/rhysd/actionlint/releases/latest | jq -r '.assets[] | select(.name | contains("linux_amd64.tar.gz")) | .browser_download_url')" | tar xz -C /usr/local/bin actionlint

      - name: Install zizmor
        run: |
          curl -sL "$(curl -s https://api.github.com/repos/woodruffw/zizmor/releases/latest | jq -r '.assets[] | select(.name | contains("x86_64-unknown-linux-gnu.tar.gz")) | .browser_download_url')" | tar xz -C /usr/local/bin zizmor

      - name: Install poutine
        run: |
          curl -sL "$(curl -s https://api.github.com/repos/boostsecurityio/poutine/releases/latest | jq -r '.assets[] | select(.name | contains("linux_amd64.tar.gz")) | .browser_download_url')" | tar xz -C /usr/local/bin poutine

      - name: Run actionlint
        run: actionlint .github/workflows/*.yml

      - name: Run zizmor
        run: zizmor --no-progress .github/workflows/*.yml

      - name: Run poutine
        run: poutine analyze_local .
