# The project site (site/) on GitHub Pages, deployed on every push to main that changes it.
# Requires Settings -> Pages -> Source: GitHub Actions. Same shape as Zigbox's and Zigcube's.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Botpike's own runners, as every other job here (Botpike/ci-runners).
    runs-on: [self-hosted, fly]
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
