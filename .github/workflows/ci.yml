# Every push and pull request to main, and every release (release.yml calls this first).
# Every job runs on GitHub's hosted runners (ubuntu-24.04: 4 vCPU and 16 GB for a public
# repository), since the repository is public and a fork's pull request must never run on a
# self-hosted runner (P147e, superseding the Fly runners of N57 and N59). The pinned toolchain
# comes from Actions' cache. The jobs run in parallel, balanced so none is much longer than the
# others (N57).
#
# Zig's build cache (P285). Every job that compiles Nerva restores ~/.cache/zig and .zig-cache
# (./.github/actions/zig-cache) and saves them as its last step (./.github/actions/zig-cache-save).
# The key is the job, the OS, the hash of zig/download.sh (the pinned Zig), build.zig and src/**;
# a restore without an exact hit takes the newest entry of the same job and Zig, and Zig's
# content-addressed cache recompiles only what the change touched. Only a push to main saves (a
# release's call of this workflow is one): a pull request, from a fork or not, only restores, so
# it cannot poison the cache. A restore over 1500 MB is dropped, since Zig never prunes. Sizes
# are in the pull request that added this and are printed by each job ("zig-cache: saving").
# The toolchain has its own cache, above, since it lives outside both.
name: CI

on:
  # Markdown alone (docs, CHANGELOG) pushed to main starts nothing (N68); release.yml's call still
  # runs. A pull request always runs, since the ruleset requires every check on it, but the
  # `changes` job turns every step of a docs-only one into a no-op (see below). The site is
  # NervaLog/nervalog.github.io now (P148).
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Installs the Zig pinned by zig/download.sh. Checkout removes ./zig's toolchain, so it is kept
  # on the Machine's volume, under the cache directory, keyed by download.sh's hash (which holds
  # the version and checksums), and linked back in; Zig finds its lib next to the real binary.
  # A copy is used only if complete (written aside, then renamed) and it runs; otherwise it is
  # replaced by a fresh download. download.sh then checks the version, as before. First, a disk
  # left too full by earlier jobs on the volume is freed (free_disk.sh, N65).
  INSTALL_ZIG: |
    set -eu
    .github/scripts/free_disk.sh
    cache="${XDG_CACHE_HOME:-$HOME/.cache}/nerva-toolchain"
    toolchain="$cache/zig-$(sha256sum zig/download.sh | cut -c1-16)"
    if [ -x "$toolchain/zig" ] && [ -f "$toolchain/lib/std/std.zig" ]; then
      rm -rf zig/zig zig/lib
      ln -s "$toolchain/zig" zig/zig
      ln -s "$toolchain/lib" zig/lib
    fi
    if ! ./zig/zig env > /dev/null 2>&1 || [ ! -f zig/lib/std/std.zig ]; then
      rm -rf zig/zig zig/lib
      ./zig/download.sh
      mkdir -p "$cache"
      rm -rf "$toolchain" "$toolchain.partial"
      mkdir "$toolchain.partial"
      cp -a zig/zig zig/lib "$toolchain.partial/"
      mv "$toolchain.partial" "$toolchain"
    fi
    echo "Zig $(./zig/zig version) from $(readlink -f zig/zig)"
    ./zig/download.sh

jobs:

  # Whether the change can affect what CI proves. Markdown alone starts no run on a push to main
  # (N68), but a pull request must still report every required check, or a docs-only pull request
  # could never merge. So every job below runs on every pull request, and a docs-only one skips
  # each step, not the job: a skipped matrix job reports under its bare name, and the required
  # names (`vopr (1)`, `demo (seats_chaos.py)`) would never appear. Fail closed: if the changed
  # files cannot be listed, or there are more than the API lists (3000), the answer is `true`.
  # If `changes` itself fails, every job still runs every step (the `!cancelled()` and
  # `!= 'false'` conditions), so an empty output never skips a required check.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Classify the change (.github/scripts/docs_only.sh)
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && [ -n "$PR" ]; then
            if gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate \
                 --jq '.[].filename' > files.txt \
               && [ -s files.txt ] && [ "$(wc -l < files.txt)" -ge "${CHANGED:-0}" ] \
               && [ "$(wc -l < files.txt)" -lt 3000 ]; then
              code=$(.github/scripts/docs_only.sh < files.txt)
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  # P251: the old `system` job ran these serially (about 26 minutes). They are split into jobs that
  # run in parallel, and `system` below aggregates them under the required check's name. The
  # typecheck builds the nerva binary that the view tests run, so they go together.
  checks:
    needs: changes
    if: ${{ !cancelled() }}
    name: check, fmt, scripts, views
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false

      # GitHub's runners start empty: the pinned toolchain is restored from Actions' cache, keyed by
      # download.sh's hash, where INSTALL_ZIG looks for it (P147e).
      - uses: actions/cache@v4
        if: needs.changes.outputs.code != 'false'
        with:
          path: ~/.cache/nerva-toolchain
          key: nerva-toolchain-${{ runner.os }}-${{ hashFiles('zig/download.sh') }}

      - name: Install the pinned Zig
        if: needs.changes.outputs.code != 'false'
        run: eval "$INSTALL_ZIG"

      # Zig's build cache: restored everywhere, saved by the last step on a push to main only.
      - uses: ./.github/actions/zig-cache
        if: needs.changes.outputs.code != 'false'
        with:
          name: check

      - name: Typecheck
        if: needs.changes.outputs.code != 'false'
        run: ./zig/zig build check

      - name: Format
        if: needs.changes.outputs.code != 'false'
        run: ./zig/zig build test:fmt

      - name: Docs-only classifier (table test)
        if: needs.changes.outputs.code != 'false'
        run: .github/scripts/docs_only_test.sh

      - name: Release scripts (the bill of materials, N63)
        if: needs.changes.outputs.code != 'false'
        run: python3 .github/scripts/test_sbom.py

      - name: Nightly perf scripts (the comparison, its issues)
        if: needs.changes.outputs.code != 'false'
        run: |
          python3 perf/nightly/test_compare.py
          python3 perf/nightly/test_file_issue.py

      - name: Simulation fleet's reporter (fingerprints, dedup, caps; no network, P147i)
        if: needs.changes.outputs.code != 'false'
        run: python3 ops/sim-fleet/test_sim_fleet.py

      - name: Jepsen nightly's reporter (fingerprints, dedup, caps, bounds; no network)
        if: needs.changes.outputs.code != 'false'
        run: python3 -I ops/jepsen/test_jepsen_report.py

      - name: Declared views (against a model)
        if: needs.changes.outputs.code != 'false'
        run: ./zig/zig build test:views

      - uses: ./.github/actions/zig-cache-save
        if: needs.changes.outputs.code != 'false'
        with:
          name: check

  # Three real replicas; about 3.5 GiB of disk.
  integration:
    needs: changes
    if: ${{ !cancelled() }}
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false

      # GitHub's runners start empty: the pinned toolchain is restored from Actions' cache, keyed by
      # download.sh's hash, where INSTALL_ZIG looks for it (P147e).
      - uses: actions/cache@v4
        if: needs.changes.outputs.code != 'false'
        with:
          path: ~/.cache/nerva-toolchain
          key: nerva-toolchain-${{ runner.os }}-${{ hashFiles('zig/download.sh') }}

      - name: Install the pinned Zig
        if: needs.changes.outputs.code != 'false'
        run: eval "$INSTALL_ZIG"

      # Zig's build cache: restored everywhere, saved by the last step on a push to main only.
      - uses: ./.github/actions/zig-cache
        if: needs.changes.outputs.code != 'false'
        with:
          name: integration

      - name: Integration (three real replicas)
        if: needs.changes.outputs.code != 'false'
        run: ./zig/zig build test:integration

      - uses: ./.github/actions/zig-cache-save
        if: needs.changes.outputs.code != 'false'
        with:
          name: integration

  api:
    needs: changes
    if: ${{ !cancelled() }}
    name: API
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false

      # GitHub's runners start empty: the pinned toolchain is restored from Actions' cache, keyed by
      # download.sh's hash, where INSTALL_ZIG looks for it (P147e).
      - uses: actions/cache@v4
        if: needs.changes.outputs.code != 'false'
        with:
          path: ~/.cache/nerva-toolchain
          key: nerva-toolchain-${{ runner.os }}-${{ hashFiles('zig/download.sh') }}

      - name: Install the pinned Zig
        if: needs.changes.outputs.code != 'false'
        run: eval "$INSTALL_ZIG"

      # Zig's build cache: restored everywhere, saved by the last step on a push to main only.
      - uses: ./.github/actions/zig-cache
        if: needs.changes.outputs.code != 'false'
        with:
          name: api

      - name: JSON API (against a model)
        if: needs.changes.outputs.code != 'false'
        run: ./zig/zig build test:api

      - uses: ./.github/actions/zig-cache-save
        if: needs.changes.outputs.code != 'false'
        with:
          name: api

  releases:
    needs: changes
    if: ${{ !cancelled() }}
    name: releases
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false

      # GitHub's runners start empty: the pinned toolchain is restored from Actions' cache, keyed by
      # download.sh's hash, where INSTALL_ZIG looks for it (P147e).
      - uses: actions/cache@v4
        if: needs.changes.outputs.code != 'false'
        with:
          path: ~/.cache/nerva-toolchain
          key: nerva-toolchain-${{ runner.os }}-${{ hashFiles('zig/download.sh') }}

      - name: Install the pinned Zig
        if: needs.changes.outputs.code != 'false'
        run: eval "$INSTALL_ZIG"

      # Zig's build cache: restored everywhere, saved by the last step on a push to main only.
      - uses: ./.github/actions/zig-cache
        if: needs.changes.outputs.code != 'false'
        with:
          name: releases

      - name: Mixed releases (a second nerva, another release string)
        if: needs.changes.outputs.code != 'false'
        run: ./zig/zig build test:release

      - uses: ./.github/actions/zig-cache-save
        if: needs.changes.outputs.code != 'false'
        with:
          name: releases

  # Every release target compiles (#276). release.yml cross-compiles all four from Linux, so a
  # change that only builds on Linux (a `std.os.linux` call, a Linux-only flag) must fail here, not
  # when a release is cut. A pull request type-checks each target with `zig build check
  # -Dtarget=T` (a Debug build of the same `nerva` executable from src/nerva_main.zig, so it
  # analyses the same code the release build reaches; it is the step that finds #276's error on
  # both macOS targets, and takes about 1.5 minutes a target cold, against about 4 for ReleaseSafe).
  # A push to main, and a release's call of this workflow, then build all four with `-Drelease`, as
  # release.yml builds them. Nothing is run. The cache is saved after the type-check only, so it
  # holds Debug artifacts and stays small.
  targets:
    needs: changes
    if: ${{ !cancelled() }}
    name: release targets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false

      # GitHub's runners start empty: the pinned toolchain is restored from Actions' cache, keyed by
      # download.sh's hash, where INSTALL_ZIG looks for it (P147e).
      - uses: actions/cache@v4
        if: needs.changes.outputs.code != 'false'
        with:
          path: ~/.cache/nerva-toolchain
          key: nerva-toolchain-${{ runner.os }}-${{ hashFiles('zig/download.sh') }}

      - name: Install the pinned Zig
        if: needs.changes.outputs.code != 'false'
        run: eval "$INSTALL_ZIG"

      # Zig's build cache: restored everywhere, saved by the last step on a push to main only.
      - uses: ./.github/actions/zig-cache
        if: needs.changes.outputs.code != 'false'
        with:
          name: targets

      - name: Type-check every release target (zig build check)
        if: needs.changes.outputs.code != 'false'
        run: |
          for target in x86_64-linux aarch64-linux x86_64-macos aarch64-macos; do
            ./zig/zig build check -Dtarget="$target"
          done

      - uses: ./.github/actions/zig-cache-save
        if: needs.changes.outputs.code != 'false'
        with:
          name: targets

      - name: Cross-compile every release target (as release.yml builds them)
        if: needs.changes.outputs.code != 'false' && github.event_name != 'pull_request'
        run: |
          for target in x86_64-linux aarch64-linux x86_64-macos aarch64-macos; do
            ./zig/zig build -Drelease -Dtarget="$target"
          done

  # The required check's name (the ruleset cannot change here). It passes only if every split job
  # above succeeded: `always()` so that a failed, cancelled or skipped one still runs this job and
  # fails it, instead of leaving it skipped (which a ruleset may count as passing). A docs-only
  # pull request: each split job runs and skips its steps, so each is `success`, and so is this.
  system:
    needs: [checks, integration, api, releases, targets]
    if: ${{ always() }}
    name: check, integration, API, views
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every split job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then
              echo "::error::a job this check waits for finished '$r', not 'success'"
              exit 1
            fi
          done

  unit:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false

      # GitHub's runners start empty: the pinned toolchain is restored from Actions' cache, keyed by
      # download.sh's hash, where INSTALL_ZIG looks for it (P147e).
      - uses: actions/cache@v4
        if: needs.changes.outputs.code != 'false'
        with:
          path: ~/.cache/nerva-toolchain
          key: nerva-toolchain-${{ runner.os }}-${{ hashFiles('zig/download.sh') }}

      - name: Install the pinned Zig
        if: needs.changes.outputs.code != 'false'
        run: eval "$INSTALL_ZIG"

      # Zig's build cache: restored everywhere, saved by the last step on a push to main only.
      - uses: ./.github/actions/zig-cache
        if: needs.changes.outputs.code != 'false'
        with:
          name: unit

      # `benchmark.perf: usage example` skips itself where perf_event_open is denied, as on
      # GitHub's runners and Botpike's (jobs run as a user, perf_event_paranoid 2); it fails only
      # where it is allowed without hardware counters (UPSTREAM.md).
      - name: Unit tests
        if: needs.changes.outputs.code != 'false'
        run: ./zig/zig build test:unit

      - uses: ./.github/actions/zig-cache-save
        if: needs.changes.outputs.code != 'false'
        with:
          name: unit

  # Every fuzzer, vendored and Nerva's own, at its smoke size and seed (N46, N53), so a fuzzer that
  # stops working fails here; a job of its own, so it does not lengthen the unit tests'.
  # `lsm_segmented_array` logs "too slow for the smoke mode" in Debug; that is a warning, not a
  # failure.
  fuzz:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false

      # GitHub's runners start empty: the pinned toolchain is restored from Actions' cache, keyed by
      # download.sh's hash, where INSTALL_ZIG looks for it (P147e).
      - uses: actions/cache@v4
        if: needs.changes.outputs.code != 'false'
        with:
          path: ~/.cache/nerva-toolchain
          key: nerva-toolchain-${{ runner.os }}-${{ hashFiles('zig/download.sh') }}

      - name: Install the pinned Zig
        if: needs.changes.outputs.code != 'false'
        run: eval "$INSTALL_ZIG"

      # Zig's build cache: restored everywhere, saved by the last step on a push to main only.
      - uses: ./.github/actions/zig-cache
        if: needs.changes.outputs.code != 'false'
        with:
          name: fuzz

      - name: Fuzzers (smoke)
        if: needs.changes.outputs.code != 'false'
        run: ./zig/zig build fuzz -- smoke

      - uses: ./.github/actions/zig-cache-save
        if: needs.changes.outputs.code != 'false'
        with:
          name: fuzz

  # The demos, three replicas and all, while processes are crashed and restarted: each demo on its
  # own Machine, run exactly as `zig build -Drelease test:demo -- --seconds=75` runs it.
  demo:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        demo: [seats_chaos.py, canvas_chaos.py]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false

      # The list above must stay the one test:demo runs (build.zig).
      - name: Every demo test:demo runs is in the matrix
        if: needs.changes.outputs.code != 'false'
        run: |
          listed=$(grep -o '"[a-z_]*_chaos\.py"' build.zig | tr -d '"' | sort | tr '\n' ' ')
          if [ "$listed" != "canvas_chaos.py seats_chaos.py " ]; then
            echo "::error::build.zig's test:demo runs '$listed'; update the demo matrix in ci.yml"
            exit 1
          fi

      # GitHub's runners start empty: the pinned toolchain is restored from Actions' cache, keyed by
      # download.sh's hash, where INSTALL_ZIG looks for it (P147e).
      - uses: actions/cache@v4
        if: needs.changes.outputs.code != 'false'
        with:
          path: ~/.cache/nerva-toolchain
          key: nerva-toolchain-${{ runner.os }}-${{ hashFiles('zig/download.sh') }}

      - name: Install the pinned Zig
        if: needs.changes.outputs.code != 'false'
        run: eval "$INSTALL_ZIG"

      # Zig's build cache: restored everywhere, saved by the last step on a push to main only.
      - uses: ./.github/actions/zig-cache
        if: needs.changes.outputs.code != 'false'
        with:
          name: demo

      - name: Build (release)
        if: needs.changes.outputs.code != 'false'
        run: ./zig/zig build -Drelease

      - name: ${{ matrix.demo }} under crashes
        if: needs.changes.outputs.code != 'false'
        run: python3 tests/demo/${{ matrix.demo }} zig-out/bin/nerva --seconds=75

      - uses: ./.github/actions/zig-cache-save
        if: needs.changes.outputs.code != 'false'
        with:
          name: demo

  # R5's demo (docs/demos/r5.md): three replicas, one lost and recovered while writes go on, a
  # backup, a restore drill, a wipe and a restore. Exactly what `./zig/zig build -Drelease demo-r5`
  # runs; its last line is `demo-r5: PASS` or `demo-r5: FAIL step N: ...`.
  demo_r5:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false

      # GitHub's runners start empty: the pinned toolchain is restored from Actions' cache, keyed by
      # download.sh's hash, where INSTALL_ZIG looks for it (P147e).
      - uses: actions/cache@v4
        if: needs.changes.outputs.code != 'false'
        with:
          path: ~/.cache/nerva-toolchain
          key: nerva-toolchain-${{ runner.os }}-${{ hashFiles('zig/download.sh') }}

      - name: Install the pinned Zig
        if: needs.changes.outputs.code != 'false'
        run: eval "$INSTALL_ZIG"

      # Zig's build cache: restored everywhere, saved by the last step on a push to main only.
      - uses: ./.github/actions/zig-cache
        if: needs.changes.outputs.code != 'false'
        with:
          name: demo_r5

      - name: demo-r5 (release)
        if: needs.changes.outputs.code != 'false'
        run: ./zig/zig build -Drelease demo-r5

      - uses: ./.github/actions/zig-cache-save
        if: needs.changes.outputs.code != 'false'
        with:
          name: demo_r5

  # R4's demo (docs/demos/r4.md): two clients, each with its own gateway on one three-replica
  # cluster: busy refusals and their metrics, a killed gateway, a stalled cluster, keyed resends.
  # Exactly what `./zig/zig build -Drelease demo-r4` runs; its last line is `demo-r4: PASS` or
  # `demo-r4: FAIL step N: ...`.
  demo_r4:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false

      # GitHub's runners start empty: the pinned toolchain is restored from Actions' cache, keyed by
      # download.sh's hash, where INSTALL_ZIG looks for it (P147e).
      - uses: actions/cache@v4
        if: needs.changes.outputs.code != 'false'
        with:
          path: ~/.cache/nerva-toolchain
          key: nerva-toolchain-${{ runner.os }}-${{ hashFiles('zig/download.sh') }}

      - name: Install the pinned Zig
        if: needs.changes.outputs.code != 'false'
        run: eval "$INSTALL_ZIG"

      # Zig's build cache: restored everywhere, saved by the last step on a push to main only.
      - uses: ./.github/actions/zig-cache
        if: needs.changes.outputs.code != 'false'
        with:
          name: demo_r4

      - name: demo-r4 (release)
        if: needs.changes.outputs.code != 'false'
        run: ./zig/zig build -Drelease demo-r4

      - uses: ./.github/actions/zig-cache-save
        if: needs.changes.outputs.code != 'false'
        with:
          name: demo_r4

  # Pull requests: the fixed seeds and one random seed, in Debug. Everything else (pushes to main,
  # the release's run, a dispatch) runs `vopr_main` instead (N74).
  vopr:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: ['1', '2', '5', 'random']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false

      # GitHub's runners start empty: the pinned toolchain is restored from Actions' cache, keyed by
      # download.sh's hash, where INSTALL_ZIG looks for it (P147e).
      - uses: actions/cache@v4
        if: needs.changes.outputs.code != 'false'
        with:
          path: ~/.cache/nerva-toolchain
          key: nerva-toolchain-${{ runner.os }}-${{ hashFiles('zig/download.sh') }}

      - name: Install the pinned Zig
        if: needs.changes.outputs.code != 'false'
        run: eval "$INSTALL_ZIG"

      # Zig's build cache: restored everywhere, saved by the last step on a push to main only.
      - uses: ./.github/actions/zig-cache
        if: needs.changes.outputs.code != 'false'
        with:
          name: vopr

      # A failure replays exactly with `./zig/zig build vopr -- <seed>`.
      - name: VOPR
        if: needs.changes.outputs.code != 'false'
        run: |
          seed='${{ matrix.seed }}'
          if [ "$seed" = random ]; then seed=$(od -An -N8 -tu8 /dev/urandom | tr -d ' '); fi
          echo "VOPR seed: $seed"
          echo "### VOPR seed \`$seed\`" >> "$GITHUB_STEP_SUMMARY"
          ./zig/zig build vopr -- "$seed"

      - uses: ./.github/actions/zig-cache-save
        if: needs.changes.outputs.code != 'false'
        with:
          name: vopr
  # Main, in ReleaseSafe, which runs a seed 10 to 40 times faster than Debug (N74): the fixed seeds,
  # then four lanes that each search fresh random seeds for 6 minutes (fuzz_loop.sh, as the long
  # fuzzing does, N59), about 300 seeds a push. A failing seed stops its lane and prints the
  # command that replays it, in the log and the job summary.
  vopr_main:
    needs: changes
    name: vopr (main, ${{ matrix.lane }})
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [fixed, random-1, random-2, random-3, random-4]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false

      # GitHub's runners start empty: the pinned toolchain is restored from Actions' cache, keyed by
      # download.sh's hash, where INSTALL_ZIG looks for it (P147e).
      - uses: actions/cache@v4
        if: needs.changes.outputs.code != 'false'
        with:
          path: ~/.cache/nerva-toolchain
          key: nerva-toolchain-${{ runner.os }}-${{ hashFiles('zig/download.sh') }}

      - name: Install the pinned Zig
        if: needs.changes.outputs.code != 'false'
        run: eval "$INSTALL_ZIG"

      # Zig's build cache: restored everywhere, saved by the last step on a push to main only.
      - uses: ./.github/actions/zig-cache
        if: needs.changes.outputs.code != 'false'
        with:
          name: vopr_main

      # A failure replays exactly with `./zig/zig build -Drelease vopr -- <seed>`.
      - name: VOPR seeds 1, 2 and 5 (ReleaseSafe)
        if: needs.changes.outputs.code != 'false' && (matrix.lane == 'fixed')
        run: |
          for seed in 1 2 5; do
            echo "VOPR seed: $seed"
            echo "### VOPR seed \`$seed\` (ReleaseSafe)" >> "$GITHUB_STEP_SUMMARY"
            ./zig/zig build -Drelease vopr -- "$seed"
          done

      - name: VOPR on random seeds (ReleaseSafe, 6 minutes)
        if: needs.changes.outputs.code != 'false' && (matrix.lane != 'fixed')
        run: .github/scripts/fuzz_loop.sh vopr nerva 6

      - uses: ./.github/actions/zig-cache-save
        if: needs.changes.outputs.code != 'false'
        with:
          name: vopr_main
