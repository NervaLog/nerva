# Every push and pull request to main, and every release (release.yml calls this first).
# Every job runs on Botpike's own runners (Botpike/ci-runners): a Fly Machine started for the
# job, performance-2x with 8 GB and a 10 GB volume that keeps the Zig cache between jobs.
# The jobs run in parallel, balanced so none is much longer than the others (N57).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Installs the Zig pinned by zig/download.sh. Checkout removes ./zig's toolchain, so it is kept
  # on the Machine's volume, under the cache directory, keyed by download.sh's hash (which holds
  # the version and checksums), and linked back in; Zig finds its lib next to the real binary.
  # A copy is used only if complete (written aside, then renamed) and it runs; otherwise it is
  # replaced by a fresh download. download.sh then checks the version, as before. First, a disk
  # left too full by earlier jobs on the volume is freed (free_disk.sh, N65).
  INSTALL_ZIG: |
    set -eu
    .github/scripts/free_disk.sh
    cache="${XDG_CACHE_HOME:-$HOME/.cache}/nerva-toolchain"
    toolchain="$cache/zig-$(sha256sum zig/download.sh | cut -c1-16)"
    if [ -x "$toolchain/zig" ] && [ -f "$toolchain/lib/std/std.zig" ]; then
      rm -rf zig/zig zig/lib
      ln -s "$toolchain/zig" zig/zig
      ln -s "$toolchain/lib" zig/lib
    fi
    if ! ./zig/zig env > /dev/null 2>&1 || [ ! -f zig/lib/std/std.zig ]; then
      rm -rf zig/zig zig/lib
      ./zig/download.sh
      mkdir -p "$cache"
      rm -rf "$toolchain" "$toolchain.partial"
      mkdir "$toolchain.partial"
      cp -a zig/zig zig/lib "$toolchain.partial/"
      mv "$toolchain.partial" "$toolchain"
    fi
    echo "Zig $(./zig/zig version) from $(readlink -f zig/zig)"
    ./zig/download.sh

jobs:
  # The typecheck builds the nerva binary that the integration, API and view tests run, so it goes
  # with them; the unit tests, the longest step, run alone.
  system:
    name: check, integration, API, views
    runs-on: [self-hosted, fly]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install the pinned Zig
        run: eval "$INSTALL_ZIG"

      - name: Typecheck
        run: ./zig/zig build check

      - name: Format
        run: ./zig/zig build test:fmt

      - name: Release scripts (the bill of materials, N63)
        run: python3 .github/scripts/test_sbom.py

      - name: Integration (three real replicas)
        run: ./zig/zig build test:integration

      - name: JSON API (against a model)
        run: ./zig/zig build test:api

      - name: Declared views (against a model)
        run: ./zig/zig build test:views

      - name: Mixed releases (a second nerva, another release string)
        run: ./zig/zig build test:release

  unit:
    runs-on: [self-hosted, fly]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install the pinned Zig
        run: eval "$INSTALL_ZIG"

      # `benchmark.perf: usage example` skips itself where perf_event_open is denied, as on
      # GitHub's runners and Botpike's (jobs run as a user, perf_event_paranoid 2); it fails only
      # where it is allowed without hardware counters (UPSTREAM.md).
      - name: Unit tests
        run: ./zig/zig build test:unit

  # Every fuzzer, vendored and Nerva's own, at its smoke size and seed (N46, N53), so a fuzzer that
  # stops working fails here; a job of its own, so it does not lengthen the unit tests'.
  # `lsm_segmented_array` logs "too slow for the smoke mode" in Debug; that is a warning, not a
  # failure.
  fuzz:
    runs-on: [self-hosted, fly]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install the pinned Zig
        run: eval "$INSTALL_ZIG"

      - name: Fuzzers (smoke)
        run: ./zig/zig build fuzz -- smoke

  # The demos, three replicas and all, while processes are crashed and restarted: each demo on its
  # own Machine, run exactly as `zig build -Drelease test:demo -- --seconds=75` runs it.
  demo:
    runs-on: [self-hosted, fly]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        demo: [seats_chaos.py, canvas_chaos.py]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      # The list above must stay the one test:demo runs (build.zig).
      - name: Every demo test:demo runs is in the matrix
        run: |
          listed=$(grep -o '"[a-z_]*_chaos\.py"' build.zig | tr -d '"' | sort | tr '\n' ' ')
          if [ "$listed" != "canvas_chaos.py seats_chaos.py " ]; then
            echo "::error::build.zig's test:demo runs '$listed'; update the demo matrix in ci.yml"
            exit 1
          fi

      - name: Install the pinned Zig
        run: eval "$INSTALL_ZIG"

      - name: Build (release)
        run: ./zig/zig build -Drelease

      - name: ${{ matrix.demo }} under crashes
        run: python3 tests/demo/${{ matrix.demo }} zig-out/bin/nerva --seconds=75

  # Pull requests: the fixed seeds and one random seed, in Debug. Everything else (pushes to main,
  # the release's run, a dispatch) runs `vopr_main` instead (N67).
  vopr:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, fly]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: ['1', '2', '5', 'random']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install the pinned Zig
        run: eval "$INSTALL_ZIG"

      # A failure replays exactly with `./zig/zig build vopr -- <seed>`.
      - name: VOPR
        run: |
          seed='${{ matrix.seed }}'
          if [ "$seed" = random ]; then seed=$(od -An -N8 -tu8 /dev/urandom | tr -d ' '); fi
          echo "VOPR seed: $seed"
          echo "### VOPR seed \`$seed\`" >> "$GITHUB_STEP_SUMMARY"
          ./zig/zig build vopr -- "$seed"
  # Main, in ReleaseSafe, which runs a seed 10 to 40 times faster than Debug (N67): the fixed seeds,
  # then four lanes that each search fresh random seeds for 6 minutes (fuzz_loop.sh, as the long
  # fuzzing does, N59), about 300 seeds a push. A failing seed stops its lane and prints the
  # command that replays it, in the log and the job summary.
  vopr_main:
    name: vopr (main, ${{ matrix.lane }})
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, fly]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [fixed, random-1, random-2, random-3, random-4]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install the pinned Zig
        run: eval "$INSTALL_ZIG"

      # A failure replays exactly with `./zig/zig build -Drelease vopr -- <seed>`.
      - name: VOPR seeds 1, 2 and 5 (ReleaseSafe)
        if: matrix.lane == 'fixed'
        run: |
          for seed in 1 2 5; do
            echo "VOPR seed: $seed"
            echo "### VOPR seed \`$seed\` (ReleaseSafe)" >> "$GITHUB_STEP_SUMMARY"
            ./zig/zig build -Drelease vopr -- "$seed"
          done

      - name: VOPR on random seeds (ReleaseSafe, 6 minutes)
        if: matrix.lane != 'fixed'
        run: .github/scripts/fuzz_loop.sh vopr nerva 6
