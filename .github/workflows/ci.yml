# Every push and pull request to main, and every release (release.yml calls this first).
# Every job runs on Botpike's own runners (Botpike/ci-runners): a Fly Machine started for the
# job, performance-2x with 8 GB and a 10 GB volume that keeps the Zig cache between jobs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, fly]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install the pinned Zig
        run: ./zig/download.sh

      - name: Typecheck
        run: ./zig/zig build check

      - name: Format
        run: ./zig/zig build test:fmt

      # `benchmark.perf: usage example` skips itself where perf_event_open is denied, as on
      # GitHub's runners and Botpike's (jobs run as a user, perf_event_paranoid 2); it fails only
      # where it is allowed without hardware counters (UPSTREAM.md).
      - name: Unit tests
        run: ./zig/zig build test:unit

      - name: Integration (three real replicas)
        run: ./zig/zig build test:integration

      - name: JSON API (against a model)
        run: ./zig/zig build test:api

      - name: Declared views (against a model)
        run: ./zig/zig build test:views

  # The demos, three replicas and all, while processes are crashed and restarted.
  demo:
    runs-on: [self-hosted, fly]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install the pinned Zig
        run: ./zig/download.sh

      - name: Seat and canvas demos under crashes
        run: ./zig/zig build -Drelease test:demo -- --seconds=75

  vopr:
    runs-on: [self-hosted, fly]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: ['1', '2', '5', 'random']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install the pinned Zig
        run: ./zig/download.sh

      # A failure replays exactly with `./zig/zig build vopr -- <seed>`.
      - name: VOPR
        run: |
          seed='${{ matrix.seed }}'
          if [ "$seed" = random ]; then seed=$(od -An -N8 -tu8 /dev/urandom | tr -d ' '); fi
          echo "VOPR seed: $seed"
          echo "### VOPR seed \`$seed\`" >> "$GITHUB_STEP_SUMMARY"
          ./zig/zig build vopr -- "$seed"
