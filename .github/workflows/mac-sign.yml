# Signs, notarizes and uploads the universal macOS zip to a DRAFT release (v0.7.1; amends P284, P311
# and P325). Called by release.yml after its draft exists (slice A3), or dispatched from main with a
# draft's tag (a re-run, a rehearsal). It is inert until the environment `apple-signing` exists: a job
# that names a missing environment creates it empty, so create it first, with the owner as required
# reviewer and `main` as its only deployment branch.
#
# The owner approves every run; the environment's secrets reach only the "Create the signing
# keychain" step, which hands them to .github/scripts/mac_keychain.sh (slice A1) and nothing else.
# mac-release then reads the keychain, never a secret. The signed commit is the one the draft
# targets, never the workflow's ref; the draft is checked before any secret is unlocked
# (release_check.sh mac-draft: NRV-E1119, NRV-E1120, NRV-E1116) and again before the upload. A
# re-run replaces an unpublished zip and nothing else. No cache; every action is pinned by SHA.
name: Mac sign

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'A draft release, v<VERSION>'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mac-sign-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sign:
    runs-on: macos-15
    # Notarization usually takes minutes; Apple sometimes takes longer.
    timeout-minutes: 75
    environment: apple-signing
    permissions:
      contents: write # gh release upload to the draft; GH_TOKEN goes only to the steps that need it
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Refuse a draft that cannot be signed
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # release_check.sh is on the workflow's ref, and the target commit is not checked out yet.
          # The script needs only gh and GITHUB_REPOSITORY, so fetch this one file from the ref.
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GITHUB_REPOSITORY/contents/.github/scripts/release_check.sh?ref=$GITHUB_SHA" \
            > "$RUNNER_TEMP/release_check.sh"
          chmod +x "$RUNNER_TEMP/release_check.sh"
          commit=$("$RUNNER_TEMP/release_check.sh" mac-draft "$TAG")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "$TAG is a draft targeting $commit"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.draft.outputs.commit }}
          persist-credentials: false

      - name: Install the pinned Zig (no cache)
        run: ./zig/download.sh

      - name: Create the signing keychain
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: .github/scripts/mac_keychain.sh create

      - name: mac-release, Developer ID and notarized
        env:
          IDENTITY: ${{ vars.NERVA_SIGN_IDENTITY }}
        run: |
          set -eu
          # Local only, never pushed: build.zig names the version after it (as ci.yml, P325).
          git tag "$TAG"
          args=(-Drelease mac-release -Dnotarize=true)
          if [ -n "$IDENTITY" ]; then args+=("-Dsign-identity=$IDENTITY"); fi
          ./zig/zig build "${args[@]}"

      - name: Check the zip from outside
        run: |
          set -eu
          dir=zig-out/mac-release
          zip="nerva-$TAG-universal-macos.zip"
          (cd "$dir" && shasum -a 256 -c "$zip.sha256")
          scratch="$RUNNER_TEMP/zipcheck"
          mkdir "$scratch"
          unzip -q "$dir/$zip" -d "$scratch"
          nerva="$scratch/nerva-$TAG-universal-macos/nerva"
          codesign -dv --verbose=4 "$nerva" 2> "$scratch/signature.txt"
          cat "$scratch/signature.txt"
          grep -q '^Authority=Developer ID Application' "$scratch/signature.txt" \
            || { echo "::error::the zip's nerva is not signed with a Developer ID Application certificate"; exit 1; }
          grep -Eq 'flags=0x[0-9a-f]+\([^)]*runtime' "$scratch/signature.txt" \
            || { echo "::error::the zip's nerva does not have the hardened runtime"; exit 1; }
          grep -q '^Timestamp=' "$scratch/signature.txt" \
            || { echo "::error::the zip's nerva has no secure timestamp"; exit 1; }

      - name: Upload the zip and its checksum to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.draft.outputs.commit }}
        run: |
          set -eu
          # Still a draft, still the same commit: --clobber replaces only an unpublished zip.
          again=$(.github/scripts/release_check.sh mac-draft "$TAG")
          if [ "$again" != "$COMMIT" ]; then
            echo "::error::the draft $TAG now targets $again, not $COMMIT, which was signed"
            exit 1
          fi
          gh release upload "$TAG" \
            "zig-out/mac-release/nerva-$TAG-universal-macos.zip" \
            "zig-out/mac-release/nerva-$TAG-universal-macos.zip.sha256" --clobber

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homebrew-formula
          path: zig-out/mac-release/nerva.rb
          retention-days: 90

      - name: Destroy the keychain
        if: always()
        run: .github/scripts/mac_keychain.sh destroy
