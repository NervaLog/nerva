# Ports are configurable to allow parallel instances.
# Override via .env file or environment variables:
#   PG_PORT=5433 POSTGREST_PORT=3001 docker compose up
#
# For full isolation, also set COMPOSE_PROJECT_NAME:
#   COMPOSE_PROJECT_NAME=myapp docker compose up

services:
  # PG 18
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dev
    command: postgres -c log_statement=all
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql
      - ./pg-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d dev" ]
      interval: 5s
      timeout: 3s
      retries: 20

  # PostgREST 14.1
  postgrest:
    image: postgrest/postgrest:v14.1
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      # Core DB wiring
      PGRST_DB_URI: postgres://authenticator:mysecretpassword@db:5432/dev
      PGRST_DB_SCHEMAS: iam,iam_stytch,extensions,cache
      PGRST_DB_ANON_ROLE: web_anon

      PGRST_SERVER_PORT: "3000"
      PGRST_SERVER_HOST: "0.0.0.0"

      PGRST_JWT_SECRET: 
      PGRST_JWT_ROLE_CLAIM_KEY: ".role"

      PGRST_DB_POOL: "5"
      PGRST_DB_PLAN_ENABLED: "true"
    ports:
      - "${POSTGREST_PORT:-3000}:3000"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:3000/" ]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pg-data: