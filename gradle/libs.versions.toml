[versions]
kotlin = "2.2.0"
jib = "3.5.1"
foojay = "0.10.0"
git-semver = "7.0.7"

http4k = "6.25.0.0"
flyway = "10.20.0"
postgres = "42.7.8"
uuid-creator = "6.1.0"
bouncycastle = "1.82"
encoding = "2.6.0"

arrow = "2.2.0"
jackson = "2.20.1"
gson = "2.11.0"

stytch = "8.2.0"
jda = "6.2.0"
resend = "4.11.0"
stripe-java = "31.0.0"
auth0-jwt = "4.4.0"
coroutines = "1.10.2"
classgraph = "4.8.184"

r2dbc-spi = "1.0.0.RELEASE"
r2dbc-pg = "1.1.1.RELEASE"
pgjdbc-ng = "0.8.9"
jooq = "3.20.10"

slf4j = "2.0.13"
logback = "1.5.13"
logstash-enc = "8.0"
janino = "3.1.10"
kotlin-logging = "7.0.3"

junit-jupiter = "5.10.3"
kotest = "6.0.4"
junit-pioneer = "2.3.0"

testcontainers = "1.21.4"
ngrok = "1.1.1"
micrometer = "1.13.0"

[libraries]
# --- http4k + forkhandles ---
http4k-bom = { module = "org.http4k:http4k-bom", version.ref = "http4k" }
http4k-core = { module = "org.http4k:http4k-core" }
http4k-server-undertow = { module = "org.http4k:http4k-server-undertow" }
http4k-client-okhttp = { module = "org.http4k:http4k-client-okhttp" }
http4k-template-pebble = { module = "org.http4k:http4k-template-pebble" }
http4k-format-jackson = { module = "org.http4k:http4k-format-jackson" }
http4k-api-openapi = { module = "org.http4k:http4k-api-openapi" }
http4k-config = { module = "org.http4k:http4k-config" }
http4k-platform-k8s = { module = "org.http4k:http4k-platform-k8s" }
http4k-muiltipart = { module = "org.http4k:http4k-multipart" }
http4k-ops-opentelemetry = { module = "org.http4k:http4k-ops-opentelemetry" }
http4k-ops-micrometer = { module = "org.http4k:http4k-ops-micrometer", version.ref = "http4k" }

# --- Micrometer ---
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

# --- Jackson ---
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }

# --- Gson ---
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# --- DB / migrations / crypto ---
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgres" }
uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuid-creator" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
encoding-bom = { module = "io.matthewnelson.encoding:bom", version.ref = "encoding" }
encoding-base32 = { module = "io.matthewnelson.encoding:base32", version.ref = "encoding" }

# --- Arrow stack ---
arrow-stack = { module = "io.arrow-kt:arrow-stack", version.ref = "arrow" }
arrow-core = { module = "io.arrow-kt:arrow-core" }
arrow-core-high-arity = { module = "io.arrow-kt:arrow-core-high-arity" }
arrow-fx-coroutines = { module = "io.arrow-kt:arrow-fx-coroutines" }
arrow-resilience = { module = "io.arrow-kt:arrow-resilience" }

# --- 3rd party service SDKs ---
stytch-sdk = { module = "com.stytch.java:sdk", version.ref = "stytch" }
resend-sdk = { module = "com.resend:resend-java", version.ref = "resend" }
stripe-java = { module = "com.stripe:stripe-java", version.ref = "stripe-java" }
jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
auth0-jwt = { module = "com.auth0:java-jwt", version.ref = "auth0-jwt" }

# --- Database Stuff ---
pgjdbc-ng = { module = "com.impossibl.pgjdbc-ng:pgjdbc-ng", version.ref = "pgjdbc-ng" }
jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
jooq-kotlin = { module = "org.jooq:jooq-kotlin", version.ref = "jooq" }

# --- Flyway ---
classgraph-classgraph = { module = "io.github.classgraph:classgraph", version.ref = "classgraph" }

# --- Logging ---
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-enc" }
janino = { module = "org.codehaus.janino:janino", version.ref = "janino" }
kotlin-logging-jvm = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }

# --- Testing ---
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-toxiproxy = { module = "org.testcontainers:toxiproxy", version.ref = "testcontainers" }

kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# --- DailyWombat libraries (GitHub Packages) ---
dailywombat-ledger = { module = "dev.dailywombat:ledger", version = "0.1.0" }
dailywombat-stytch = { module = "dev.dailywombat:stytch", version = "0.2.0" }
dailywombat-stripe = { module = "dev.dailywombat:stripe", version = "0.1.0" }
dailywombat-runtime = { module = "dev.dailywombat:runtime", version = "1.0.3" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay" }
git-semver = { id = "org.danilopianini.git-sensitive-semantic-versioning", version.ref = "git-semver" }
